name: Validate plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: npm ci
      - run: npm run build:brand && npm run build:icons && npm run build && npm test && npm run test:php
      - name: PHP syntax
        run: find admin includes src build -name '*.php' -exec php -l {} \; && php -l ashbi-mega-menu.php && php -l uninstall.php
      - run: npm run package && unzip dist/ashbi-mega-menu-1.0.4.zip -d release
      - name: Translation template
        run: |
          curl -sSLo /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          WP_CLI=/tmp/wp-cli.phar npm run i18n:check
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e
        with:
          build-dir: release/ashbi-mega-menu
          slug: ashbi-mega-menu
      - name: WordPress database smoke test
        if: always()
        run: |
          mkdir -p release/ashbi-mega-menu/tests
          cp tests/wordpress*.php release/ashbi-mega-menu/tests/
          wp-env run cli wp eval-file wp-content/plugins/ashbi-mega-menu/tests/wordpress-smoke.php
          wp-env run cli wp eval-file wp-content/plugins/ashbi-mega-menu/tests/wordpress-products.php
          wp-env run cli wp eval-file wp-content/plugins/ashbi-mega-menu/tests/wordpress-import-roundtrip.php
          wp-env run cli wp eval-file wp-content/plugins/ashbi-mega-menu/tests/wordpress-review-security.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-release-candidate
          path: dist/*.zip
  minimum-wordpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g @wordpress/env
      - name: Start WordPress 6.6 with PHP 8.2
        run: |
          node -e 'require("fs").writeFileSync(".wp-env.json", JSON.stringify({core:"https://wordpress.org/wordpress-6.6.zip",phpVersion:"8.2",plugins:["."]}))'
          wp-env start
          wp-env run cli wp plugin activate ashbi-mega-menu
      - name: Minimum-version database test
        run: |
          wp-env run cli wp core version
          wp-env run cli wp eval-file wp-content/plugins/ashbi-mega-menu/tests/wordpress-smoke.php
          wp-env run cli wp eval-file wp-content/plugins/ashbi-mega-menu/tests/wordpress-products.php
          wp-env run cli wp eval-file wp-content/plugins/ashbi-mega-menu/tests/wordpress-import-roundtrip.php
          wp-env run cli wp eval-file wp-content/plugins/ashbi-mega-menu/tests/wordpress-review-security.php
  multisite-uninstall:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra-network: ['0', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g @wordpress/env
      - name: Start disposable WordPress multisite with PHP 8.2
        run: |
          node -e 'require("fs").writeFileSync(".wp-env.json", JSON.stringify({phpVersion:"8.2",multisite:true,plugins:["."]}))'
          wp-env start
          wp-env run cli wp plugin activate ashbi-mega-menu --network
      - name: Verify per-site menus, placement and import/export
        run: wp-env run cli env ABMM_DISPOSABLE_TEST=1 wp eval-file wp-content/plugins/ashbi-mega-menu/tests/wordpress-multisite.php
      - name: Verify site isolation and network uninstall
        run: wp-env run cli env ABMM_DISPOSABLE_TEST=1 ABMM_EXTRA_NETWORK=${{ matrix.extra-network }} wp eval-file wp-content/plugins/ashbi-mega-menu/tests/wordpress-multisite-uninstall.php
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install -g @wordpress/env
      - name: Start disposable WordPress with PHP 8.2
        run: |
          node -e 'require("fs").writeFileSync(".wp-env.json", JSON.stringify({phpVersion:"8.2",plugins:["."]}))'
          wp-env start
          wp-env run cli wp plugin activate ashbi-mega-menu
          wp-env run cli env ABMM_DISPOSABLE_TEST=1 wp eval-file wp-content/plugins/ashbi-mega-menu/tests/e2e/seed.php
      - run: npx playwright install --with-deps ${{ matrix.browser == 'edge' && 'msedge' || matrix.browser }}
      - name: Browser tests (${{ matrix.browser }})
        run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          WP_BASE_URL: http://localhost:8888
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
  compat:
    name: compatibility (${{ matrix.setup }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - setup: classic
            env: '{"themes":["https://downloads.wordpress.org/theme/twentytwentyone.zip"]}'
          - setup: elementor
            env: '{"plugins":["https://downloads.wordpress.org/plugin/elementor.zip"]}'
          - setup: cache
            env: '{"plugins":["https://downloads.wordpress.org/plugin/cache-enabler.zip","https://downloads.wordpress.org/plugin/autoptimize.zip","https://downloads.wordpress.org/plugin/sqlite-object-cache.zip"],"config":{"WP_CACHE":true}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install -g @wordpress/env
      - name: Start WordPress with the ${{ matrix.setup }} setup
        env:
          EXTRA: ${{ matrix.env }}
        run: |
          node -e 'const x=JSON.parse(process.env.EXTRA); const c={phpVersion:"8.2",plugins:["."],...x}; c.plugins=["."].concat(x.plugins||[]); require("fs").writeFileSync(".wp-env.json", JSON.stringify(c))'
          cat .wp-env.json
          wp-env start
          wp-env run cli wp plugin activate --all
          wp-env run cli wp core version
          wp-env run cli wp plugin list --fields=name,version,status
          wp-env run cli wp theme list --fields=name,version,status
      - name: Persistent object cache is active
        if: matrix.setup == 'cache'
        run: |
          wp-env run cli wp plugin list --fields=name,version,status
          wp-env run cli wp eval 'if ( ! wp_using_ext_object_cache() ) { WP_CLI::error( "The object cache drop-in is not active." ); } echo "object cache: active\n";'
      - name: Seed
        run: wp-env run cli env ABMM_DISPOSABLE_TEST=1 ABMM_E2E_SETUP=${{ matrix.setup }} wp eval-file wp-content/plugins/ashbi-mega-menu/tests/e2e/seed.php
      - run: npx playwright install --with-deps chromium
      - name: Compatibility journeys (${{ matrix.setup }})
        run: npm run test:e2e -- --project=chromium tests/e2e/compat.spec.js tests/e2e/menu.spec.js
        env:
          WP_BASE_URL: http://localhost:8888
          ABMM_E2E_SETUP: ${{ matrix.setup }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compat-report-${{ matrix.setup }}
          path: |
            playwright-report/
            test-results/
